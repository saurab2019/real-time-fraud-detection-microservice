spring:
  application:
    name: frauddetection

  datasource:
    url: jdbc:postgresql://localhost:5432/frauddb
    username: frauduser
    password: fraudpass

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

fraud:
  rules:
    amount-threshold:
      threshold: 50000
      score: 40

    velocity:
      max-transactions: 5
      window-seconds: 60
      score: 30

    geo-anomaly:
      score: 50

  decision:
    approve-max-score: 30
    otp-max-score: 70